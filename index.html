<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Aeroport</title>
    <link rel="stylesheet" href="stylesheets/style.css">
</head>
<body>
    <!-- главная страница -->
    <section class="section-first">
        <span class="circle circle-1">1</span>
        <p class="p1">ИНСТРУКЦИЯ ПО <br>НАРУШЕНИЮ ПРАВИЛ <br>СОЗДАНИЯ ШРИФТА</p>
        <img src="images/title.svg" alt="текст аэропорт экструд">
        <div class="note">
            <span class="square"></span>
            <p class="p2">ПРОДОЛЖАЯ ЧТЕНИЕ, ВЫ СОГЛАШАЕТЕСЬ С ТЕМ, ЧТО ЕСЛИ ВЫ БУДЕТЕ ТОЧНО <br>СЛЕДОВАТЬ ПУНКТАМ, ВЫ НЕИЗБЕЖНО НАЧНЁТЕ НАРУШАТЬ ПРАВИЛА. <br>ПРОИЗВОДИТЕЛЬ НЕ НЕСЁТ ОТВЕТСТВЕННОСТИ ЗА ИСПОРЧЕННУЮ РЕПУТАЦИЮ,<br> СЛОМАННЫЕ СЕТКИ И НЕОЖИДАННЫЙ УСПЕХ ВАШИХ ПРОЕКТОВ.</p>
        </div>
        <span class="corner"></span>
        <span class="circle circle-2">2</span>
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
        <span class="star">*</span>
    </section>
    
    <!-- блок истории -->
    <section class="section-second">
        
    </section>
